          LOCK
          [[ "$(wc -l < "$lock")" -eq 103 ]]
          printf 'pins=103\n' >> "$GITHUB_OUTPUT"
          warehouse="$TOOLCHAIN_DIR/wheels"
          mkdir "$warehouse"
          python -I -m venv "$TOOLCHAIN_DIR/venv"
          py="$TOOLCHAIN_DIR/venv/bin/python"
          "$py" -I -m pip --isolated download --index-url https://pypi.org/simple \
            --no-cache-dir --disable-pip-version-check --only-binary=:all: --no-deps \
            --require-hashes -r "$lock" --dest "$warehouse"
          "$py" -I - "$lock" "$warehouse" "$GITHUB_OUTPUT" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          expected = {line.rsplit(":", 1)[1] for line in Path(sys.argv[1]).read_text().splitlines()}
          wheels = list(Path(sys.argv[2]).glob("*.whl"))
          actual = set()
          for wheel in wheels:
              with wheel.open("rb") as source:
                  actual.add(hashlib.file_digest(source, "sha256").hexdigest())
          if len(wheels) != 103 or len(expected) != 103 or actual != expected:
              raise SystemExit("Wheel inventory or SHA-256 does not match the pinned closure")
          with open(sys.argv[3], "a", encoding="utf-8") as output:
              print(f"available={len(wheels)}", file=output)
          PY
          "$py" -I -m pip --isolated install --no-index --find-links "$warehouse" \
            --no-cache-dir --disable-pip-version-check --only-binary=:all: \
            --require-hashes -r "$lock"
          "$py" -I -m pip --isolated check
          "$py" -I - "$lock" "$GITHUB_OUTPUT" <<'PY'
          from importlib import import_module, metadata
          from pathlib import Path
          import re
          import sys

          def normalize(name):
              return re.sub(r"[-_.]+", "-", name).lower()

          pins = dict(line.split()[0].split("==") for line in Path(sys.argv[1]).read_text().splitlines())
          installed = {normalize(d.metadata["Name"]): d.version for d in metadata.distributions()}
          expected_names = set(pins) | {"pip"}
          if set(installed) != expected_names:
              raise SystemExit(f"Unexpected installed metadata inventory: {sorted(set(installed) ^ expected_names)}")
          mismatches = [name for name, version in pins.items() if installed[name] != version]
          if mismatches:
              raise SystemExit(f"Unexpected installed versions: {mismatches}")
          with open(sys.argv[2], "a", encoding="utf-8") as output:
              print(f"installed={len(pins)}", file=output)
          for module in ("numpy", "pandas", "scipy", "sklearn", "joblib", "yaml", "hcl2"):
              import_module(module)
          with open(sys.argv[2], "a", encoding="utf-8") as output:
              print("imports=verified", file=output)
          PY

      - name: Verify HashiCorp signatures and Terraform version
        id: terraform
        if: steps.runner.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          cat > "$TOOLCHAIN_DIR/hashicorp.sh" <<'BASH'
          fetch() {
            curl --fail --silent --show-error --location --proto '=https' \
              --proto-redir '=https' --max-time 240 --retry 2 "$1" --output "$2"
          }

          verify_archive() {
            local project="$1" version="$2" archive="$3" expected="$4" output="$5"
            local base="https://releases.hashicorp.com/$project/$version"
            local sums="${project}_${version}_SHA256SUMS"
            local scratch="$TOOLCHAIN_DIR/$project"
            local fingerprint="C874011F0AB405110D02105534365D9472D7468F"
            local signing_subkey="374EC75B485913604A831CC7C820C6D5CD27AB87"
            local signer

            mkdir "$scratch"
            fetch "$base/$sums" "$scratch/sums"
            fetch "$base/$sums.72D7468F.sig" "$scratch/sums.sig"
            signer="$(gpg --batch --no-tty --homedir "$TOOLCHAIN_DIR/gnupg" \
              --no-auto-key-retrieve --status-fd 1 --verify "$scratch/sums.sig" "$scratch/sums")"
            # A generic KEYEXPIRED can refer to an unrelated subkey in the keyring.
            awk -v pin="$fingerprint" -v subkey="$signing_subkey" '
              $2 ~ /^(BADSIG|ERRSIG|REVKEYSIG|EXPKEYSIG|EXPSIG)$/ { bad=1 }
              $2 == "VALIDSIG" && $3 == subkey && $NF == pin { verified++ }
              END { exit(bad || verified != 1) }
            ' <<< "$signer"
            [[ "$(awk -v name="$archive" '$2 == name {print $1}' "$scratch/sums")" == "$expected" ]]
            fetch "$base/$archive" "$output"
            printf '%s  %s\n' "$expected" "$output" | sha256sum --check --status
          }
          BASH
          . "$TOOLCHAIN_DIR/hashicorp.sh"
          mkdir -m 700 "$TOOLCHAIN_DIR/gnupg"
          fetch https://www.hashicorp.com/.well-known/pgp-key.txt "$TOOLCHAIN_DIR/hashicorp.pub"
          gpg --batch --no-tty --homedir "$TOOLCHAIN_DIR/gnupg" --import "$TOOLCHAIN_DIR/hashicorp.pub"
          archive="$TOOLCHAIN_DIR/terraform.zip"
          verify_archive terraform 1.16.2 terraform_1.16.2_linux_amd64.zip \
            0d17011f0c4664539b164b044903d04e296c86c13cb9f28040076c65cfb3985a "$archive"
          python3 -I - "$archive" "$TOOLCHAIN_DIR/bin" <<'PY'
          from pathlib import Path
          import shutil
          import sys
          import zipfile

          destination = Path(sys.argv[2])
          destination.mkdir()
          binary = destination / "terraform"
          with zipfile.ZipFile(sys.argv[1]) as archive, archive.open("terraform") as source, binary.open("xb") as out:
              shutil.copyfileobj(source, out)
          binary.chmod(0o500)
          PY
          mkdir -m 700 "$TOOLCHAIN_DIR/terraform-home"
          env -i PATH=/usr/bin:/bin HOME="$TOOLCHAIN_DIR/terraform-home" CHECKPOINT_DISABLE=1 \
            "$TOOLCHAIN_DIR/bin/terraform" version -json > "$TOOLCHAIN_DIR/terraform-version.json"
          python3 -I - "$TOOLCHAIN_DIR/terraform-version.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          from pathlib import Path
          import sys

          result = json.loads(Path(sys.argv[1]).read_bytes())
          if result.get("terraform_version") != "1.16.2" or result.get("platform") != "linux_amd64":
              raise SystemExit(f"Unexpected Terraform version or platform: {result}")
          print("Terraform 1.16.2 linux_amd64")
          with open(sys.argv[2], "a", encoding="utf-8") as output:
              print("observed=1.16.2 linux_amd64", file=output)
          PY

      - name: Verify Checkov CLI from the locked environment
        id: checkov
        if: steps.dependencies.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -m 700 "$TOOLCHAIN_DIR/checkov-home"
          version="$(env -i PATH=/usr/bin:/bin HOME="$TOOLCHAIN_DIR/checkov-home" PYTHONDONTWRITEBYTECODE=1 \
            "$TOOLCHAIN_DIR/venv/bin/checkov" --version)"
          [[ "$version" == "3.3.17" ]]
          printf 'observed=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'Checkov %s\n' "$version"

      - name: Verify AWS provider and initialize an isolated fixture
        id: provider
        if: steps.terraform.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          . "$TOOLCHAIN_DIR/hashicorp.sh"
          archive=terraform-provider-aws_5.100.0_linux_amd64.zip
          digest=1589a2266af699cbd5d80737a0fe02e54ec9cf2ca54e7e00ac51c7359056f274
          fixture="$TOOLCHAIN_DIR/provider-fixture"
          mirror="$TOOLCHAIN_DIR/provider-mirror"
          package_dir="$mirror/registry.terraform.io/hashicorp/aws"
          mkdir -p "$fixture" "$package_dir"
          fetch https://registry.terraform.io/v1/providers/hashicorp/aws/5.100.0/download/linux/amd64 \
            "$TOOLCHAIN_DIR/provider-distribution.json"
          python3 -I - "$TOOLCHAIN_DIR/provider-distribution.json" "$archive" "$digest" <<'PY'
          import json
          from pathlib import Path
          import sys

          metadata = json.loads(Path(sys.argv[1]).read_bytes())
          base = "https://releases.hashicorp.com/terraform-provider-aws/5.100.0/"
          checksums = base + "terraform-provider-aws_5.100.0_SHA256SUMS"
          expected = {"os": "linux", "arch": "amd64", "filename": sys.argv[2], "shasum": sys.argv[3],
                      "download_url": base + sys.argv[2], "shasums_url": checksums,
                      "shasums_signature_url": checksums + ".72D7468F.sig"}
          if any(metadata.get(key) != value for key, value in expected.items()):
              raise SystemExit("Registry distribution metadata differs from trusted provider pins")
          PY
          printf 'metadata=verified\n' >> "$GITHUB_OUTPUT"
          verify_archive terraform-provider-aws 5.100.0 "$archive" "$digest" "$package_dir/$archive"
          printf 'archive=verified\n' >> "$GITHUB_OUTPUT"

          cat > "$fixture/main.tf" <<'HCL'
          terraform {
            required_version = "= 1.16.2"
            required_providers {
              aws = {
                source  = "hashicorp/aws"
                version = "= 5.100.0"
              }
            }
          }
          HCL
          cat > "$fixture/.terraform.lock.hcl" <<'HCL'
          provider "registry.terraform.io/hashicorp/aws" {
            version     = "5.100.0"
            constraints = "5.100.0"
            hashes = [
              "h1:edXOJWE4ORX8Fm+dpVpICzMZJat4AX0VRCAy/xkcOc0=",
              "zh:1589a2266af699cbd5d80737a0fe02e54ec9cf2ca54e7e00ac51c7359056f274",
            ]
          }
          HCL
          python3 -I - "$mirror" "$TOOLCHAIN_DIR/terraform.tfrc" <<'PY'
          import json
          from pathlib import Path
          import sys

          mirror = json.dumps(sys.argv[1])
          Path(sys.argv[2]).write_text(
              'disable_checkpoint = true\nprovider_installation {\n  filesystem_mirror {\n'
              f'    path = {mirror}\n    include = ["registry.terraform.io/hashicorp/aws"]\n  }}\n}}\n'
          )
          PY
          sha256sum "$fixture/.terraform.lock.hcl" > "$TOOLCHAIN_DIR/fixture-lock.sha256"
          mkdir -m 700 "$TOOLCHAIN_DIR/provider-home"
          chmod a-w "$package_dir/$archive"
          data="$TOOLCHAIN_DIR/provider-data"
          timeout 180s env -i PATH=/usr/bin:/bin HOME="$TOOLCHAIN_DIR/provider-home" \
            AWS_EC2_METADATA_DISABLED=true AWS_CONFIG_FILE=/dev/null AWS_SHARED_CREDENTIALS_FILE=/dev/null \
            TF_IN_AUTOMATION=1 CHECKPOINT_DISABLE=1 TF_CLI_CONFIG_FILE="$TOOLCHAIN_DIR/terraform.tfrc" \
            TF_DATA_DIR="$data" "$TOOLCHAIN_DIR/bin/terraform" -chdir="$fixture" \
            init -backend=false -input=false -no-color -lockfile=readonly
          sha256sum --check --status "$TOOLCHAIN_DIR/fixture-lock.sha256"
          plugin="$data/providers/registry.terraform.io/hashicorp/aws/5.100.0/linux_amd64/terraform-provider-aws_v5.100.0_x5"
          [[ -f "$plugin" && -x "$plugin" && ! -L "$plugin" ]]
          printf 'init=verified\n' >> "$GITHUB_OUTPUT"

      - name: Report component results and enforce the smoke result
        if: ${{ always() }}
        env:
          RUNNER_OUTCOME: ${{ steps.runner.outcome }}
          RUNNER_OBSERVED: ${{ steps.runner.outputs.observed }}
          PYTHON_SETUP_OUTCOME: ${{ steps.python_setup.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          PYTHON_OBSERVED: ${{ steps.python.outputs.observed }}
          DEP_OUTCOME: ${{ steps.dependencies.outcome }}
          DEP_PINS: ${{ steps.dependencies.outputs.pins }}
          DEP_AVAILABLE: ${{ steps.dependencies.outputs.available }}
          DEP_INSTALLED: ${{ steps.dependencies.outputs.installed }}
          DEP_IMPORTS: ${{ steps.dependencies.outputs.imports }}
          TF_OUTCOME: ${{ steps.terraform.outcome }}
          TF_OBSERVED: ${{ steps.terraform.outputs.observed }}
          CHECKOV_OUTCOME: ${{ steps.checkov.outcome }}
          CHECKOV_OBSERVED: ${{ steps.checkov.outputs.observed }}
          PROVIDER_OUTCOME: ${{ steps.provider.outcome }}
          PROVIDER_METADATA: ${{ steps.provider.outputs.metadata }}
          PROVIDER_ARCHIVE: ${{ steps.provider.outputs.archive }}
          PROVIDER_INIT: ${{ steps.provider.outputs.init }}
        run: |
          set -euo pipefail
          state() {
            case "$1" in
              success) printf 'PASS' ;;
              failure|cancelled) printf 'FAIL' ;;
              *) printf 'NOT_RUN' ;;
            esac
          }

          python_state="$(state "$PYTHON_OUTCOME")"
          if [[ "$PYTHON_SETUP_OUTCOME" == failure ]]; then python_state=FAIL; fi
          deps_state="$(state "$DEP_OUTCOME")"
          if [[ "$deps_state" == FAIL && -n "$DEP_AVAILABLE" ]]; then deps_state=PARTIAL; fi
          provider_state=NOT_VERIFIED
          if [[ "$PROVIDER_OUTCOME" == success && "$PROVIDER_INIT" == verified ]]; then
            provider_state=PASS
          elif [[ "$PROVIDER_METADATA" == verified ]]; then
            provider_state=PARTIAL
          fi

          overall=FAIL
          if [[ "$RUNNER_OUTCOME" == success && "$python_state" == PASS && "$deps_state" == PASS &&
                "$TF_OUTCOME" == success && "$CHECKOV_OUTCOME" == success && "$provider_state" == PASS ]]; then
            overall=PASS
          fi
          {
            echo '## Toolchain smoke'
            echo '| Component | Expected | Observed | Status |'
            echo '|---|---|---|---|'
            printf '| Runner | Ubuntu 24.04 x64 | %s | %s |\n' "${RUNNER_OBSERVED:-no verified observation}" "$(state "$RUNNER_OUTCOME")"
            printf '| Python | 3.12.3 | %s | %s |\n' "${PYTHON_OBSERVED:-no verified observation}" "$python_state"
            printf '| Python dependencies | CI-2 exact wheels (103) | pins %s, wheels %s, installed %s, ABI imports %s | %s |\n' \
              "${DEP_PINS:-unverified}" "${DEP_AVAILABLE:-unverified}" "${DEP_INSTALLED:-unverified}" "${DEP_IMPORTS:-unverified}" "$deps_state"
            printf '| Terraform | 1.16.2 | %s | %s |\n' "${TF_OBSERVED:-no verified observation}" "$(state "$TF_OUTCOME")"
            printf '| Checkov | 3.3.17 | %s | %s |\n' "${CHECKOV_OBSERVED:-no verified observation}" "$(state "$CHECKOV_OUTCOME")"
            printf '| AWS provider | 5.100.0 linux_amd64 | registry %s, signed archive %s, fixture init %s | %s |\n' \
              "${PROVIDER_METADATA:-unverified}" "${PROVIDER_ARCHIVE:-unverified}" "${PROVIDER_INIT:-unverified}" "$provider_state"
            printf '\nWorkflow result: **%s**\n' "$overall"
            echo 'This job checks toolchain readiness only.'
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$overall" == PASS ]]
