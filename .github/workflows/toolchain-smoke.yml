name: Toolchain smoke

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  toolchain:
    name: Hosted toolchain smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify runner and create private workspace
        id: runner
        continue-on-error: true
        run: |
          set -euo pipefail
          . /etc/os-release
          arch="$(uname -m)"
          printf 'Runner: %s %s (%s)\n' "$ID" "$VERSION_ID" "$arch"
          [[ "$ID" == ubuntu && "$VERSION_ID" == 24.04 && "$arch" == x86_64 ]]
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 ]]
          workspace="$(realpath -e -- "$GITHUB_WORKSPACE")"
          runner_temp="$(realpath -e -- "$RUNNER_TEMP")"
          [[ "$(pwd -P)" == "$workspace" && -d "$runner_temp" ]]
          if [[ "$workspace/" == "$runner_temp/"* || "$runner_temp/" == "$workspace/"* ]]; then
            echo 'Workspace and runner temp must be separate.' >&2
            exit 1
          fi
          entry="$(find "$workspace" -mindepth 1 -maxdepth 1 -print -quit)"
          [[ -z "$entry" ]]
          for command in curl gpg python3 realpath sha256sum timeout; do
            command -v "$command" >/dev/null || { echo "Missing runner tool: $command" >&2; exit 1; }
          done
          toolchain="$(mktemp -d "$runner_temp/ci3b0.XXXXXXXX")"
          printf 'TOOLCHAIN_DIR=%s\n' "$toolchain" >> "$GITHUB_ENV"
          printf 'observed=Ubuntu %s %s\n' "$VERSION_ID" "$arch" >> "$GITHUB_OUTPUT"

      - name: Provision exact CPython
        id: python_setup
        if: steps.runner.outcome == 'success'
        continue-on-error: true
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.3'
          architecture: x64
          check-latest: false
          token: ''

      - name: Verify CPython version and architecture
        id: python
        if: steps.python_setup.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          python -I - "$GITHUB_OUTPUT" <<'PY'
          import platform
          import sys

          version = platform.python_version()
          print(f"{platform.python_implementation()} {version} {platform.machine()}")
          with open(sys.argv[1], "a", encoding="utf-8") as output:
              print(f"observed={version}", file=output)
          if platform.python_implementation() != "CPython" or version != "3.12.3":
              raise SystemExit("Unexpected Python implementation or patch version")
          if sys.platform != "linux" or platform.machine() != "x86_64":
              raise SystemExit("Expected Linux x86_64 Python")
          PY

      - name: Verify and install exact Linux wheels
        id: dependencies
        if: steps.python.outcome == 'success'
        continue-on-error: true
        env:
          PIP_CONFIG_FILE: /dev/null
        run: |
          set -euo pipefail
          lock="$TOOLCHAIN_DIR/requirements.txt"
          # Public PyPI metadata for the exact Linux wheels, one SHA-256 per distribution.
          cat > "$lock" <<'LOCK'
