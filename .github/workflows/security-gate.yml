name: Security Gate advisory

on:
  workflow_run:
    workflows: [Security Gate PR signal]
    types: [completed]
  workflow_dispatch:
    inputs:
      fixture:
        description: Trusted synthetic Terraform fixture
        type: choice
        options: [pass, review, error]
        required: true

permissions:
  contents: read

jobs:
  advisory:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' &&
       github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      RUNTIME_SHA: ${{ vars.CI_GATE_RUNTIME_SHA }}
      RUNTIME_ARCHIVE_SHA: ${{ vars.CI_GATE_RUNTIME_ARCHIVE_SHA256 }}
      UBUNTU_IMAGE: ${{ vars.CI_GATE_UBUNTU_IMAGE }}
    steps:
      - name: Allocate one isolated output directory per attempt
        id: workspace
        run: |
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          timestamp="$(date -u -d "$started" +%Y%m%dT%H%M%SZ)"
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          name="${timestamp}_run-${GITHUB_RUN_ID}_attempt-${GITHUB_RUN_ATTEMPT}"
          root="$(mktemp -d "$RUNNER_TEMP/ci3b.XXXXXXXX")"
          mkdir "$root/raw" "$root/tools"
          {
            printf 'RUN_ROOT=%s\n' "$root"
            printf 'RAW_DIR=%s\n' "$root/raw"
            printf 'REPORT_DIR=%s\n' "$root/$name"
            printf 'TOOLCHAIN_DIR=%s\n' "$root/tools"
            printf 'BUNDLE_DIR=%s\n' "$root/bundle"
            printf 'STARTED_UTC=%s\n' "$started"
          } >> "$GITHUB_ENV"
          printf 'name=%s\n' "$name" >> "$GITHUB_OUTPUT"

      - name: Check out the trusted workflow commit
        id: control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted-control
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Resolve PR input and check trusted release pins
        id: pins
        run: |
          [[ "$(git -C trusted-control rev-parse HEAD)" == "$GITHUB_SHA" ]]
          . /etc/os-release
          [[ "$ID" == ubuntu && "$VERSION_ID" == 24.04 && "$(uname -m)" == x86_64 ]]
          [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            python3 -I -B trusted-control/.github/ci_gate.py resolve-pr >> "$GITHUB_OUTPUT"
          fi
          [[ "$RUNTIME_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Trusted runtime commit pin missing or invalid.'; exit 1; }
          [[ "$RUNTIME_ARCHIVE_SHA" =~ ^[0-9a-f]{64}$ ]] || { echo 'Trusted archive digest missing or invalid.'; exit 1; }
          [[ "$UBUNTU_IMAGE" =~ ^docker\.io/library/ubuntu@sha256:[0-9a-f]{64}$ ]] ||
            { echo 'Trusted Ubuntu OCI digest missing or invalid.'; exit 1; }

      - name: Check out the independently pinned release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RUNTIME_SHA }}
          path: trusted-release
          persist-credentials: false
          submodules: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /security_gate_payload/ci-gate-v1.tar

      - name: Verify and unpack the trusted runtime
        id: archive
        run: |
          [[ "$(git -C trusted-release rev-parse HEAD)" == "$RUNTIME_SHA" ]]
          python3 -I -B trusted-control/.github/ci_gate.py unpack \
            trusted-release/security_gate_payload/ci-gate-v1.tar "$RUNTIME_ARCHIVE_SHA" "$BUNDLE_DIR"

      - name: Provision exact CPython
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.3'
          architecture: x64
          check-latest: false
          token: ''

      - name: Provision the CI-3B0 toolchain
        id: provision
        env:
          PIP_CONFIG_FILE: /dev/null
        run: |
          python -I -B -c 'import platform,sys; assert platform.python_implementation()=="CPython" and platform.python_version()=="3.12.3" and platform.machine()=="x86_64" and sys.platform=="linux"'
          python -I -B trusted-control/.github/ci_gate.py provision "$RUN_ROOT"
          for stage in dependencies terraform checkov provider; do
            GITHUB_OUTPUT="$RUN_ROOT/toolchain-$stage.txt" bash --noprofile --norc "$RUN_ROOT/ci3b0-$stage.sh"
          done
          docker pull --platform linux/amd64 "$UBUNTU_IMAGE"

      - name: Check out the exact Terraform PR head in a separate directory
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pins.outputs.sha }}
          path: pr-source
          persist-credentials: false
          submodules: false
          lfs: false
          sparse-checkout: terraform

      - name: Stage only bounded Terraform blobs or a trusted fixture
        id: input
        env:
          PR_SHA: ${{ steps.pins.outputs.sha }}
          FIXTURE: ${{ inputs.fixture }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            python -I -B trusted-control/.github/ci_gate.py stage pr-source "$PR_SHA" "$RUN_ROOT/input"
          else
            python -I -B trusted-control/.github/ci_gate.py fixture "$FIXTURE" "$RUN_ROOT/input"
          fi

      - name: Run the parity Gate in an offline read-only sandbox
        id: gate
        run: |
          pyroot="$(python -I -B -c 'import sys; print(sys.base_prefix)')"
          [[ "$pyroot" == /opt/hostedtoolcache/Python/3.12.3/x64 ]]
          set +e
          timeout --kill-after=15s 720s docker run --rm --pull never --platform linux/amd64 --network none \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --memory 5g --cpus 2 --pids-limit 256 \
            --tmpfs /tmp:rw,nosuid,nodev,exec,size=768m,mode=1777 \
            --mount "type=bind,src=/usr,dst=/usr,readonly" \
            --mount "type=bind,src=$pyroot,dst=$pyroot,readonly" \
            --mount "type=bind,src=$BUNDLE_DIR,dst=$BUNDLE_DIR,readonly" \
            --mount "type=bind,src=$TOOLCHAIN_DIR/bin,dst=$TOOLCHAIN_DIR/bin,readonly" \
            --mount "type=bind,src=$TOOLCHAIN_DIR/provider-mirror,dst=$TOOLCHAIN_DIR/provider-mirror,readonly" \
            --mount "type=bind,src=$TOOLCHAIN_DIR/terraform.tfrc,dst=$TOOLCHAIN_DIR/terraform.tfrc,readonly" \
            --mount "type=bind,src=$RUN_ROOT/input,dst=/input,readonly" \
            --mount "type=bind,src=$RAW_DIR,dst=/output" \
            --entrypoint /usr/bin/env "$UBUNTU_IMAGE" -i \
            PATH="$TOOLCHAIN_DIR/bin:/usr/bin:/bin" HOME=/tmp LANG=C.UTF-8 \
            TF_CLI_CONFIG_FILE="$TOOLCHAIN_DIR/terraform.tfrc" \
            "$pyroot/bin/python3" -I -B "$BUNDLE_DIR/runtime/scripts/prototype_v1/ci_release_verifier.py" \
            --release "$BUNDLE_DIR" \
            --expected-manifest-sha256 e9c723e256dfbe31ea927ad74990686b94b2f8d7831bc7c665b55ba109a73fa2 \
            --dev-only --launch -- \
            --terraform /input --environment dev --asset-criticality low --data-sensitivity low \
            --output /output/gate.json > "$RUN_ROOT/gate.log" 2>&1
          rc=$?
          set -e
          printf 'exit=%s\n' "$rc" >> "$GITHUB_OUTPUT"

      - name: Verify Gate and generate offline advisory reports
        id: report
        if: ${{ always() && steps.workspace.outcome == 'success' }}
        env:
          GATE_EXIT: ${{ steps.gate.outputs.exit }}
          PR_SHA: ${{ steps.pins.outputs.sha }}
          CI_PR_NUMBER: ${{ steps.pins.outputs.number }}
          CONTROL_OUTCOME: ${{ steps.control.outcome }}
          ARTIFACT_NAME: security-gate-${{ steps.workspace.outputs.name }}
          PINS_OUTCOME: ${{ steps.pins.outcome }}
          ARCHIVE_OUTCOME: ${{ steps.archive.outcome }}
          PROVISION_OUTCOME: ${{ steps.provision.outcome }}
          INPUT_OUTCOME: ${{ steps.input.outcome }}
          FIXTURE: ${{ inputs.fixture }}
        run: |
          python_bin=python3
          if [[ -x "$BUNDLE_DIR/runtime/.venv/bin/python" ]]; then
            python_bin="$BUNDLE_DIR/runtime/.venv/bin/python"
          fi
          if rc="$("$python_bin" -I -B trusted-control/.github/reporting/generate_report.py --output "$REPORT_DIR")"; then
            case "$rc" in 0|10|20) ;; *) exit 20 ;; esac
          else
            # Even a failed control checkout or broken renderer gets a minimal diagnostic.
            # A fresh directory prevents publication of partially rendered files.
            export REPORT_DIR="$RUN_ROOT/diagnostic"
            rc=20
            python3 -I -B - <<'PY'
          from datetime import datetime, timezone
          from hashlib import sha256
          import json, os
          from pathlib import Path
          env = os.environ
          base = Path(env["REPORT_DIR"])
          base.mkdir()
          stage = "CONTROL_CHECKOUT" if env["CONTROL_OUTCOME"] != "success" else "REPORT_GENERATION"
          record = dict(schema_version="ci4-advisory-execution-v1", enforcement="ADVISORY_ONLY",
                        started_utc=env["STARTED_UTC"], finished_utc=datetime.now(timezone.utc).isoformat(),
                        github_run_id=int(env["GITHUB_RUN_ID"]), github_run_attempt=int(env["GITHUB_RUN_ATTEMPT"]),
                        github_run_number=int(env["GITHUB_RUN_NUMBER"]), fixture_expectation=None,
                        gate_status=None, gate_exit_code=None, gate_json_sha256=None, gate_result_sha256=None,
                        wrapper_status="ERROR", wrapper_exit_code=20, failure_stage=stage, counts=None,
                        artifact_name=env["ARTIFACT_NAME"])
          payload = (json.dumps(record, indent=2, sort_keys=True) + "\n").encode()
          summary = (f"## Security Gate · ADVISORY_ONLY\nGate: N/A · Wrapper: ERROR/20 · {stage}\n\n"
                     f"Run {record['github_run_id']} · attempt {record['github_run_attempt']}\n\n"
                     f"Artifact: {record['artifact_name']}\n\nFindings / context: N/A\n")
          from html import escape
          files = {"execution.json": payload, "execution.json.sha256": (sha256(payload).hexdigest() + "  execution.json\n").encode(),
                   "report.md": summary.encode(), "report.html": ('<!doctype html><meta charset="utf-8"><title>Security Gate</title><pre>'
                                                                + escape(summary) + '</pre>').encode()}
          for name, data in files.items():
              (base / name).write_bytes(data)
          (base / "checksums.sha256").write_text("".join(f"{sha256(v).hexdigest()}  {k}\n" for k,v in sorted(files.items())))
          PY
          fi
          (cd "$REPORT_DIR" && sha256sum --check --strict checksums.sha256)
          cat "$REPORT_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"
          printf 'exit=%s\npath=%s\n' "$rc" "$REPORT_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload the run record for PASS, REVIEW or ERROR
        id: upload
        if: ${{ always() && steps.report.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-gate-${{ steps.workspace.outputs.name }}
          path: |
            ${{ steps.report.outputs.path }}/report.html
            ${{ steps.report.outputs.path }}/report.md
            ${{ steps.report.outputs.path }}/execution.json
            ${{ steps.report.outputs.path }}/execution.json.sha256
            ${{ steps.report.outputs.path }}/gate-result.json
            ${{ steps.report.outputs.path }}/gate-result.json.sha256
            ${{ steps.report.outputs.path }}/checksums.sha256
          if-no-files-found: error
          retention-days: 30
          overwrite: false

      - name: Finish with the verified advisory process status
        if: ${{ always() }}
        env:
          ADVISORY_EXIT: ${{ steps.report.outputs.exit }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          if [[ "$UPLOAD_OUTCOME" != success ]]; then
            echo "Wrapper cuối: ERROR/20 · Báo cáo chưa được lưu thành artifact." >> "$GITHUB_STEP_SUMMARY"
            exit 20
          fi
          case "$ADVISORY_EXIT" in 0|10|20) exit "$ADVISORY_EXIT" ;; *) exit 20 ;; esac
